name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake make git
          dkp-pacman -S --noconfirm --needed 3ds-zlib 3ds-libpng || true

      - name: Build picaGL
        run: |
          # Daedalus-3DS was built against picaGL's "revamp" branch (pglInitEx);
          # pin to the commit matching Daedalus' last update (Oct 2022).
          git clone https://github.com/masterfeizz/picaGL /tmp/picaGL
          git -C /tmp/picaGL checkout f149fed
          # 2022 code vs current libctru: use the new __3DS__ define, don't fail on warnings
          sed -i 's/-DARM11 -D_3DS/-D__3DS__/; s/-Werror//' /tmp/picaGL/Makefile
          make -C /tmp/picaGL -j$(nproc)
          mkdir -p $DEVKITPRO/picaGL
          cp -r /tmp/picaGL/lib /tmp/picaGL/include $DEVKITPRO/picaGL/

      - name: Build imgui-picaGL
        run: |
          git clone --depth 1 https://github.com/masterfeizz/imgui-picaGL /tmp/imgui
          mkdir -p $DEVKITPRO/portlibs/3ds/include
          sed -i 's/^CFLAGS   = /CFLAGS   = -D__3DS__ /' /tmp/imgui/Makefile
          make -C /tmp/imgui -j$(nproc)
          make -C /tmp/imgui install

      - name: Build DaedalusX64 (3DS)
        run: |
          mkdir -p daedbuild && cd daedbuild
          cmake -DCTR_RELEASE=1 ../Source -DCMAKE_TOOLCHAIN_FILE=../Tools/3dstoolchain.cmake -G "Unix Makefiles"
          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: DaedalusX64-3ds
          path: daedbuild/*.3dsx
